<dx-popup
  [(visible)]="visible"
  [showTitle]="false"
  [showCloseButton]="false"
  [width]="350"
  [height]="300"
  [dragEnabled]="false"
  [resizeEnabled]="false"
  [shading]="true"
  [shadingColor]="'rgba(0,0,0,0.4)'"
  contentTemplate="successContent">

  <div *dxTemplate="let data of 'successContent'" class="success-modal-content">
    <div class="success-icon-container">
      <div class="success-icon">
        <i class="fas fa-check"></i>
      </div>
    </div>
    <h3 class="success-title">{{ title }}</h3>
    <p class="success-message" [innerHTML]="message"></p>
    <button class="success-button" (click)="onClose()">{{ buttonText }}</button>
  </div>
</dx-popup>
