<dx-popup
  [(visible)]="visible"
  [showTitle]="false"
  [showCloseButton]="false"
  [width]="350"
  [height]="300"
  [dragEnabled]="false"
  [resizeEnabled]="false"
  [shading]="true"
  [shadingColor]="'rgba(0,0,0,0.4)'"
  contentTemplate="errorContent">

  <div *dxTemplate="let data of 'errorContent'" class="error-modal-content">
    <div class="error-icon-container">
      <div class="error-icon">
        <i class="fas fa-times"></i>
      </div>
    </div>
    <h3 class="error-title">{{ title }}</h3>
    <p class="error-message" [innerHTML]="message"></p>
    <button class="error-button" (click)="onClose()">{{ buttonText }}</button>
  </div>
</dx-popup>
